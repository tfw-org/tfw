name: Java Security Scan (No Container)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # 1. Build project and generate the precise Maven SBOM (target/bom.json)
    # This acts as our primary inventory source
    - name: Build project and generate SBOM
      run: mvn clean package

    # 2. Gatekeeper: Run Trivy to scan the repository filesystem for secrets,
    # misconfigurations, and vulnerable code. It will fail the build if CRITICAL issues exist.
    - name: Run Trivy Scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        ignore-unfixed: true
        format: 'table'
        exit-code: '1' # Fails the build on findings
        severity: 'CRITICAL'

    # 3. Auditor: Run Grype directly against the precise Maven-generated SBOM.
    # It checks for package vulnerabilities using a different database pool.
    - name: Run Grype Scanner
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
      with:
        sbom: 'target/bom.json'
        fail-build: false # Logs findings to console without breaking the build
