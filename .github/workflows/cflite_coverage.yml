name: ClusterFuzzLite coverage

concurrency:
  group: clusterfuzzlite-coverage
  cancel-in-progress: true

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Coverage:
    if: ${{ github.repository == 'tfw-org/tfw' }}
    runs-on: ubuntu-latest

    steps:
      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: jvm
          sanitizer: coverage

      - name: Generate Coverage Report
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: coverage
          sanitizer: coverage
          language: jvm
          storage-repo: https://${{ secrets.TFW_FUZZING_TOKEN }}@github.com/tfw-org/tfw-fuzzing.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages

      - name: Check out tfw-fuzzing Pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tfw-org/tfw-fuzzing
          ref: gh-pages
          path: tfw-fuzzing-pages
          token: ${{ secrets.TFW_FUZZING_TOKEN }}
          persist-credentials: false

      - name: Calculate and publish GitHub Pages size
        working-directory: tfw-fuzzing-pages
        env:
          TFW_FUZZING_TOKEN: ${{ secrets.TFW_FUZZING_TOKEN }}
        run: |
          # Calculate the size of the published files, excluding
          # the root metadata file itself.
          total_bytes=$(find . -type f \
            ! -path './.git/*' \
            ! -path './site-size.json' \
            -printf '%s\n' | awk '{sum += $1} END {print sum}')
          file_count=$(find . -type f \
            ! -path './.git/*' \
            ! -path './site-size.json' | wc -l)
          total_size=$(numfmt --to=iec --suffix=B "$total_bytes")

          # Publish machine-readable site-size information.
          cat > site-size.json <<EOF
          {
            "bytes": ${total_bytes},
            "size": "${total_size}",
            "files": ${file_count}
          }
          EOF

          echo "GitHub Pages size: ${total_size} (${total_bytes} bytes)"
          echo "Files published: ${file_count}"

          # Commit the updated size information.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site-size.json

          if git diff --cached --quiet; then
            echo "GitHub Pages size information has not changed."
          else
            git commit -m "Update GitHub Pages size"
            auth_header=$(printf 'x-access-token:%s' \
              "$TFW_FUZZING_TOKEN" | base64 -w0)
            git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
              push origin gh-pages
          fi
