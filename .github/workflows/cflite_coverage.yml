name: ClusterFuzzLite coverage

concurrency:
  group: clusterfuzzlite-coverage
  cancel-in-progress: true

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Coverage:
    if: ${{ github.repository == 'tfw-org/tfw' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Fuzzers
        id: build
        uses: ./.github/actions/cflite-build-fuzzers
        with:
          language: jvm
          sanitizer: coverage

      - name: Generate Coverage Report
        id: run
        uses: ./.github/actions/cflite-run-fuzzers
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: coverage
          sanitizer: coverage
          language: jvm
          storage-repo: https://${{ secrets.TFW_FUZZING_TOKEN }}@github.com/tfw-org/tfw-fuzzing.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages

      - name: Inspect Generated Coverage
        if: always()
        shell: bash
        run: |
          echo "=== ClusterFuzzLite coverage workspace ==="

          if [ ! -d cifuzz-coverage ]; then
            echo "ERROR: cifuzz-coverage directory was not created."
            exit 1
          fi

          echo "--- Files ---"
          find cifuzz-coverage -type f -print | sort

          echo "--- Directories ---"
          find cifuzz-coverage -type d -print | sort

          echo "--- Expected report files ---"

          for file in \
            cifuzz-coverage/report/linux/index.html \
            cifuzz-coverage/report/linux/index.xml \
            cifuzz-coverage/report/linux/jacoco.exec \
            cifuzz-coverage/report/linux/jacoco.xml \
            cifuzz-coverage/dumps/jacoco.merged.exec
          do
            if [ -f "$file" ]; then
              ls -lh "$file"
            else
              echo "MISSING: $file"
            fi
          done
