name: Update Pitest PR

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Intentional privileged follow-up; this workflow never checks out or executes PR code.
    workflows: ["pitest"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pitest-update-pr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Pitest results
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          workflow: ${{ github.event.workflow_run.workflow_id }}
          run_id: ${{ github.event.workflow_run.id }}
          name: pitest
          path: target/pit-reports-ci

      - name: Update pull request
        env:
          REPO_TOKEN: ${{ github.token }}
        run: >
          mvn -B
          com.arcmutate:pitest-github-maven-plugin:2.3.3:updatePR
