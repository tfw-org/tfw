name: Publish GitHub Pages

on:
  push:
    branches: [ "master" ]
  release:
    types: [ released ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish reports
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Checkout project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: master
        persist-credentials: false

    - name: Set up Java 21-temurin
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install build dependencies
      run: sudo apt-get install -y tightvncserver pandoc

    - name: Build OpenJDK APIDiff
      env:
        APIDIFF_COMMIT: 70c3b131b73c95f4c17f5c0b489c5794d414d1c3
      run: |
        APIDIFF_SOURCE="$RUNNER_TEMP/apidiff-source"

        # Fetch the official OpenJDK APIDiff source at a pinned commit.
        git init "$APIDIFF_SOURCE"
        git -C "$APIDIFF_SOURCE" remote add origin \
          https://github.com/openjdk/apidiff.git
        git -C "$APIDIFF_SOURCE" fetch --depth=1 origin "$APIDIFF_COMMIT"
        git -C "$APIDIFF_SOURCE" checkout --detach FETCH_HEAD

        # Build APIDiff and its self-contained distribution.
        bash "$APIDIFF_SOURCE/make/build.sh"

        APIDIFF="$APIDIFF_SOURCE/build/images/apidiff/bin/apidiff"

        if [ ! -x "$APIDIFF" ]; then
          echo "::error::APIDiff executable was not created."
          exit 1
        fi

        echo "APIDIFF=$APIDIFF" >> "$GITHUB_ENV"

    - name: Run full mutation testing
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MAVEN_BUILD_LOG: ${{ runner.temp }}/maven-build.log
      run: |
        set -o pipefail

        # Capture the complete Maven output while displaying it in Actions.
        "${{ github.workspace }}/execute-on-vnc.sh" \
          ./mvnw -B \
          clean \
          test-compile \
          -Ppitest \
          -DtimestampedReports=false \
          org.pitest:pitest-maven:mutationCoverage \
          2>&1 | tee "$MAVEN_BUILD_LOG"

    - name: Extract Error Prone reports
      env:
        MAVEN_BUILD_LOG: ${{ runner.temp }}/maven-build.log
      run: |
        REPORT_DIR="$RUNNER_TEMP/errorprone"
        mkdir -p "$REPORT_DIR"

        # Clear any previous reports before extracting new ones.
        : > "$REPORT_DIR/main.txt"
        : > "$REPORT_DIR/test.txt"

        # Extract the complete production and test compiler sections.
        # A section ends when a blank INFO line is followed by
        # the next Maven task separator. The blank INFO line is
        # excluded from the extracted report.
        awk \
          -v main_file="$REPORT_DIR/main.txt" \
          -v test_file="$REPORT_DIR/test.txt" '
          function write_line(line) {
            if (section == 1) {
              print line > main_file
            } else if (section == 2) {
              print line > test_file
            }
          }

          BEGIN {
            section = 0
            pending_blank = 0
            main_found = 0
            test_found = 0
          }

          # Start production compilation.
          /^\[INFO\] --- maven-compiler-plugin:[^:]+:compile \(default-compile\) @ / {
            section = 1
            main_found = 1
            pending_blank = 0
            print > main_file
            next
          }

          # Start test compilation.
          /^\[INFO\] --- maven-compiler-plugin:[^:]+:testCompile \(default-testCompile\) @ / {
            section = 2
            test_found = 1
            pending_blank = 0
            print > test_file
            next
          }

          {
            if (section != 0) {
              # End the current compiler section at the next
              # Maven task separator following a blank INFO line.
              if (pending_blank &&
                  /^\[INFO\] --- /) {
                section = 0
                pending_blank = 0
                next
              }

              # Preserve the previously buffered blank INFO line
              # unless it was the task boundary.
              if (pending_blank) {
                write_line(pending_line)
                pending_blank = 0
              }

              # Hold blank INFO lines until the next line tells
              # us whether they are section boundaries.
              if (/^\[INFO\][[:space:]]*$/) {
                pending_line = $0
                pending_blank = 1
                next
              }

              write_line($0)
            }
          }

          END {
            # Preserve a trailing blank INFO line if the log
            # ended without a following Maven task separator.
            if (pending_blank && section != 0) {
              write_line(pending_line)
            }

            if (!main_found) {
              print "Production compiler section was not found." > "/dev/stderr"
            }

            if (!test_found) {
              print "Test compiler section was not found." > "/dev/stderr"
            }

            if (!main_found || !test_found) {
              exit 1
            }
          }
        ' "$MAVEN_BUILD_LOG"

        echo "Compiler reports extracted:"
        ls -l "$REPORT_DIR"

    - name: Generate development Javadoc
      run: >
        ./mvnw -B
        javadoc:javadoc
        -DoutputDirectory=target/reports/apidocs
        -Ddoclint=none
        -DfailOnError=false

    - name: Preserve development API inputs
      run: |
        API_WORK="$RUNNER_TEMP/tfw-apidiff"

        mkdir -p "$API_WORK/master"

        # Preserve the source files used to generate the master Javadoc.
        cp -R src/main/java "$API_WORK/master/source"

        # Keep only Java source files for APIDiff package discovery.
        find "$API_WORK/master/source" -type f ! -name '*.java' -delete

        # Preserve the compile-time dependencies for this API version.
        ./mvnw -B dependency:build-classpath \
          -DincludeScope=compile \
          "-Dmdep.outputFile=$API_WORK/master-classpath.txt"

        # Preserve the generated development Javadoc.
        mkdir -p target/pages/javadoc
        cp -R target/reports/apidocs/. target/pages/javadoc/

    - name: Get latest release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! release_tag=$(gh api \
          "repos/${GITHUB_REPOSITORY}/releases/latest" \
          --jq '.tag_name'); then
          echo "::error::No non-draft GitHub release found; cannot generate release Javadoc."
          exit 1
        fi

        echo "Latest release: ${release_tag}"
        echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"

    - name: Generate latest release Javadoc
      run: |
        API_WORK="$RUNNER_TEMP/tfw-apidiff"

        echo "Generating Javadoc for release ${RELEASE_TAG}"

        # Fetch the exact release tag.
        if ! git fetch --depth=1 origin \
          "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"; then
          echo "::error::Unable to fetch tag ${RELEASE_TAG} for the latest GitHub release."
          exit 1
        fi

        # Check out the exact source corresponding to the latest GitHub release.
        git checkout --detach "${RELEASE_TAG}"

        # Preserve the release source files.
        mkdir -p "$API_WORK/release"
        cp -R src/main/java "$API_WORK/release/source"

        # Keep only Java source files for APIDiff package discovery.
        find "$API_WORK/release/source" -type f ! -name '*.java' -delete

        # Preserve the release compile-time dependencies.
        if [ -x ./mvnw ]; then
          MVN=./mvnw
        else
          MVN=mvn
        fi

        "$MVN" -B dependency:build-classpath \
          -DincludeScope=compile \
          "-Dmdep.outputFile=$API_WORK/release-classpath.txt"

        # Generate Javadoc for the released source.
        rm -rf target/reports/apidocs

        "$MVN" -B \
          javadoc:javadoc \
          -DoutputDirectory=target/reports/apidocs \
          -Ddoclint=none \
          -DfailOnError=false

        # Put the release Javadoc under /javadoc/latest/.
        mkdir -p target/pages/javadoc/latest
        cp -R target/reports/apidocs/. target/pages/javadoc/latest/

    - name: Generate API difference report
      run: |
        API_WORK="$RUNNER_TEMP/tfw-apidiff"

        # Return to the master checkout.
        git checkout --detach origin/master

        echo "Comparing release ${RELEASE_TAG} with master."

        # Generate the comparison report.
        if "$APIDIFF" \
          --api release \
            --label "Latest Release (${RELEASE_TAG})" \
            --source-path "$API_WORK/release/source" \
            --class-path "$(cat "$API_WORK/release-classpath.txt")" \
            --api-directory "$GITHUB_WORKSPACE/target/pages/javadoc/latest" \
            --release 9 \
          --api master \
            --label "Development (master)" \
            --source-path "$API_WORK/master/source" \
            --class-path "$(cat "$API_WORK/master-classpath.txt")" \
            --api-directory "$GITHUB_WORKSPACE/target/pages/javadoc" \
            --release 9 \
          --include 'tfw.**' \
          --exclude 'tfw.math.**' \
          --compare-doc-comments true \
          --compare-api-descriptions true \
          --title "TFW API Differences" \
          --description "Changes from the latest release to master." \
          --output-directory target/pages/apidiff; then

          echo "APIDiff completed successfully: no API differences found."

        else
          apidiff_status=$?

          if [ "$apidiff_status" -eq 1 ]; then
            echo "APIDiff completed successfully: API differences were found."
          else
            echo "::error::APIDiff failed with exit code ${apidiff_status}."
            echo "Temporary source files have been retained for troubleshooting."
            exit "$apidiff_status"
          fi
        fi

        # Remove temporary source trees and classpath files.
        rm -rf "$API_WORK"
        rm -rf "$RUNNER_TEMP/apidiff-source"

    - name: Generate PMD reports
      run: |
        ./mvnw -B pmd:pmd

        for report in target/pmd.txt target/pmd.xml; do
          if [ ! -s "$report" ]; then
            echo "::error::PMD report missing or empty: $report"
            exit 1
          fi
        done

    - name: Generate CPD reports
      run: |
        ./mvnw -B pmd:cpd

        # Verify that all CPD reports were generated.
        for report in target/cpd.txt target/cpd.xml target/reports/cpd.html; do
          if [ ! -f "$report" ]; then
            echo "::error::CPD report missing: $report"
            exit 1
          fi
        done

        # Make an empty text report explicit when no duplications are found.
        if [ ! -s target/cpd.txt ]; then
          echo "No duplicate code detected." > target/cpd.txt
        fi

        # Verify that the HTML report's supporting assets exist.
        for asset in css fonts images img js; do
          if [ ! -d "target/reports/$asset" ]; then
            echo "::error::CPD HTML report asset directory missing: $asset"
            exit 1
          fi
        done

    - name: Prepare GitHub Pages
      run: |
        # Return to the master checkout for consistency.
        git checkout --detach origin/master

        mkdir -p target/pages/pit
        mkdir -p target/pages/pmd
        mkdir -p target/pages/cpd
        mkdir -p target/pages/errorprone

        cp -R target/pit-reports/. target/pages/pit/

        cp target/pmd.txt target/pmd.xml target/pages/pmd/

        cp target/cpd.txt target/cpd.xml target/pages/cpd/
        cp target/reports/cpd.html target/pages/cpd/

        # Preserve the assets required by the CPD HTML report.
        cp -R target/reports/css target/reports/fonts \
          target/reports/images target/reports/img \
          target/reports/js target/pages/cpd/

        # Publish the production and test compiler reports.
        cp "$RUNNER_TEMP/errorprone/main.txt" \
          "$RUNNER_TEMP/errorprone/test.txt" \
          target/pages/errorprone/

        # Calculate the sizes of the reports.
        development_javadoc_bytes=$(find target/pages/javadoc -type f ! -path '*/latest/*' -printf '%s\n' | awk '{sum += $1} END {print sum}')
        release_javadoc_bytes=$(find target/pages/javadoc/latest -type f -printf '%s\n' | awk '{sum += $1} END {print sum}')
        apidiff_bytes=$(find target/pages/apidiff -type f -printf '%s\n' | awk '{sum += $1} END {print sum}')
        pit_bytes=$(find target/pages/pit -type f -printf '%s\n' | awk '{sum += $1} END {print sum}')
        pmd_bytes=$(find target/pages/pmd -type f -printf '%s\n' | awk '{sum += $1} END {print sum}')
        cpd_bytes=$(find target/pages/cpd -type f -printf '%s\n' | awk '{sum += $1} END {print sum}')
        errorprone_bytes=$(find target/pages/errorprone -type f -printf '%s\n' | awk '{sum += $1} END {print sum}')

        report_bytes=$((development_javadoc_bytes + release_javadoc_bytes + apidiff_bytes + pit_bytes + pmd_bytes + cpd_bytes + errorprone_bytes))

        development_javadoc_size=$(numfmt --to=iec --suffix=B "$development_javadoc_bytes")
        release_javadoc_size=$(numfmt --to=iec --suffix=B "$release_javadoc_bytes")
        apidiff_size=$(numfmt --to=iec --suffix=B "$apidiff_bytes")
        pit_size=$(numfmt --to=iec --suffix=B "$pit_bytes")
        pmd_size=$(numfmt --to=iec --suffix=B "$pmd_bytes")
        cpd_size=$(numfmt --to=iec --suffix=B "$cpd_bytes")
        errorprone_size=$(numfmt --to=iec --suffix=B "$errorprone_bytes")
        report_size=$(numfmt --to=iec --suffix=B "$report_bytes")

        # Create the top-level GitHub Pages landing page.
        cat > target/pages/index.html <<EOF
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>TFW Reports</title>
        </head>
        <body>
          <h1>TFW Reports</h1>

          <h2>Documentation</h2>

          <ul>
            <li>
              <a href="javadoc/">Development Javadoc</a>
              — documentation for the current master branch.
            </li>
            <li>
              <a href="javadoc/latest/">Latest Release Javadoc</a>
              — documentation for release ${RELEASE_TAG}.
            </li>
            <li>
              <a href="apidiff/">API Differences</a>
              — comparison of the latest release API with master.
            </li>
          </ul>

          <h2>Testing</h2>

          <ul>
            <li>
              <a href="pit/">Mutation Testing Report</a>
              — PIT mutation testing results for the current master branch.
            </li>
            <li>
              <a href="pmd/pmd.txt">PMD Report (Text)</a>
              — PMD static analysis results in text format.
            </li>
            <li>
              <a href="pmd/pmd.xml">PMD Report (XML)</a>
              — PMD static analysis results in XML format.
            </li>
            <li>
              <a href="cpd/cpd.html">CPD Report (HTML)</a>
              — copy/paste detection results in HTML format.
            </li>
            <li>
              <a href="cpd/cpd.txt">CPD Report (Text)</a>
              — copy/paste detection results in text format.
            </li>
            <li>
              <a href="cpd/cpd.xml">CPD Report (XML)</a>
              — copy/paste detection results in XML format.
            </li>
            <li>
              <a href="errorprone/main.txt">Production Error Prone Report</a>
              - complete production compiler-task output.
            </li>
            <li>
              <a href="errorprone/test.txt">Test Error Prone Report</a>
              - complete test compiler-task output.
            </li>
          </ul>

          <h2>Site Information</h2>

          <table>
            <tr>
              <th>Content</th>
              <th>Size</th>
            </tr>
            <tr>
              <td>Development Javadoc</td>
              <td>${development_javadoc_size}</td>
            </tr>
            <tr>
              <td>Latest Release Javadoc (${RELEASE_TAG})</td>
              <td>${release_javadoc_size}</td>
            </tr>
            <tr>
              <td>API Differences</td>
              <td>${apidiff_size}</td>
            </tr>
            <tr>
              <td>PIT report</td>
              <td>${pit_size}</td>
            </tr>
            <tr>
              <td>PMD reports</td>
              <td>${pmd_size}</td>
            </tr>
            <tr>
              <td>CPD reports</td>
              <td>${cpd_size}</td>
            </tr>
            <tr>
              <td>Error Prone reports</td>
              <td>${errorprone_size}</td>
            </tr>
            <tr>
              <td>Total reports</td>
              <td>${report_size}</td>
            </tr>
          </table>

          <p>
            Report sizes are calculated from the files published to GitHub Pages.
          </p>
        </body>
        </html>
        EOF

        # Calculate the exact size of the complete published site,
        # including the top-level index.html.
        total_bytes=$(find target/pages -type f -printf '%s\n' | awk '{sum += $1} END {print sum}')
        file_count=$(find target/pages -type f | wc -l)
        total_size=$(numfmt --to=iec --suffix=B "$total_bytes")

        # Publish machine-readable site-size information for badges and other tooling.
        cat > target/pages/site-size.json <<EOF
        {
          "bytes": ${total_bytes},
          "size": "${total_size}",
          "files": ${file_count}
        }
        EOF

        echo
        echo "GitHub Pages content:"
        echo "  Latest release:         ${RELEASE_TAG}"
        echo "  Total site size:        ${total_size} (${total_bytes} bytes)"
        echo "  Development Javadoc:    ${development_javadoc_size} (${development_javadoc_bytes} bytes)"
        echo "  Release Javadoc:        ${release_javadoc_size} (${release_javadoc_bytes} bytes)"
        echo "  API Differences:        ${apidiff_size} (${apidiff_bytes} bytes)"
        echo "  PIT size:               ${pit_size} (${pit_bytes} bytes)"
        echo "  PMD size:               ${pmd_size} (${pmd_bytes} bytes)"
        echo "  CPD size:               ${cpd_size} (${cpd_bytes} bytes)"
        echo "  Error Prone reports:    ${errorprone_size} (${errorprone_bytes} bytes)"
        echo "  Total reports:          ${report_size} (${report_bytes} bytes)"
        echo "  File count:             ${file_count}"

    - name: Configure GitHub Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: target/pages

  deploy:
    name: Deploy GitHub Pages
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
