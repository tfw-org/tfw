name: Publish GitHub Pages

on:
  push:
    branches: [ "master" ]
  release:
    types: [ released ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish reports
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Checkout project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: master
        persist-credentials: false

    - name: Set up Java 21-temurin
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install build dependencies
      run: sudo apt-get install -y tightvncserver pandoc

    - name: Build OpenJDK APIDiff
      env:
        APIDIFF_COMMIT: 70c3b131b73c95f4c17f5c0b489c5794d414d1c3
      run: |
        APIDIFF_SOURCE="$RUNNER_TEMP/apidiff-source"

        # Fetch the official OpenJDK APIDiff source at a pinned commit.
        git init "$APIDIFF_SOURCE"
        git -C "$APIDIFF_SOURCE" remote add origin \
          https://github.com/openjdk/apidiff.git
        git -C "$APIDIFF_SOURCE" fetch --depth=1 origin "$APIDIFF_COMMIT"
        git -C "$APIDIFF_SOURCE" checkout --detach FETCH_HEAD

        # Work around APIDiff's assumption that a module is always available.
        # When analyzing Java 8 source, getModuleElement("java.base") returns null.
        python3 - "$APIDIFF_SOURCE/src/share/classes/jdk/codetools/apidiff/model/SerializedFormFactory.java" <<'PY'
        from pathlib import Path
        import sys

        path = Path(sys.argv[1])
        source = path.read_text()

        old = """    private TypeMirror getType(ModuleElement me, String name) {
                return elements.getTypeElement(me, name).asType();
            }"""

        new = """    private TypeMirror getType(ModuleElement me, String name) {
                return (me == null
                        ? elements.getTypeElement(name)
                        : elements.getTypeElement(me, name)).asType();
            }"""

        if source.count(old) != 1:
            raise SystemExit("Expected APIDiff source code was not found exactly once.")

        path.write_text(source.replace(old, new))
        print("Applied Java 8 module compatibility fix.")
        PY

        # Build APIDiff and its self-contained distribution.
        bash "$APIDIFF_SOURCE/make/build.sh"

        APIDIFF="$APIDIFF_SOURCE/build/images/apidiff/bin/apidiff"

        if [ ! -x "$APIDIFF" ]; then
          echo "::error::APIDiff executable was not created."
          exit 1
        fi

        echo "APIDIFF=$APIDIFF" >> "$GITHUB_ENV"

    - name: Run full mutation testing
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >
        ${{ github.workspace }}/execute-on-vnc.sh
        ./mvnw -B
        clean
        test-compile
        -Ppitest
        -DtimestampedReports=false
        org.pitest:pitest-maven:mutationCoverage

    - name: Generate development Javadoc
      run: >
        ./mvnw -B
        javadoc:javadoc
        -DoutputDirectory=target/reports/apidocs
        -Ddoclint=none
        -DfailOnError=false

    - name: Preserve development API inputs
      run: |
        API_WORK="$RUNNER_TEMP/tfw-apidiff"

        mkdir -p "$API_WORK/master"

        # Preserve the source files used to generate the master Javadoc.
        cp -R src/main/java "$API_WORK/master/source"

        # Preserve the compile-time dependencies for this API version.
        ./mvnw -B dependency:build-classpath \
          -DincludeScope=compile \
          "-Dmdep.outputFile=$API_WORK/master-classpath.txt"

        # Preserve the generated development Javadoc.
        mkdir -p target/pages/javadoc
        cp -R target/reports/apidocs/. target/pages/javadoc/

    - name: Get latest release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! release_tag=$(gh api \
          "repos/${GITHUB_REPOSITORY}/releases/latest" \
          --jq '.tag_name'); then
          echo "::error::No non-draft GitHub release found; cannot generate release Javadoc."
          exit 1
        fi

        echo "Latest release: ${release_tag}"
        echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"

    - name: Generate latest release Javadoc
      run: |
        API_WORK="$RUNNER_TEMP/tfw-apidiff"

        echo "Generating Javadoc for release ${RELEASE_TAG}"

        # Fetch the exact release tag.
        if ! git fetch --depth=1 origin \
          "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"; then
          echo "::error::Unable to fetch tag ${RELEASE_TAG} for the latest GitHub release."
          exit 1
        fi

        # Check out the exact source corresponding to the latest GitHub release.
        git checkout --detach "${RELEASE_TAG}"

        # Preserve the release source files.
        mkdir -p "$API_WORK/release"
        cp -R src/main/java "$API_WORK/release/source"

        # Preserve the release compile-time dependencies.
        if [ -x ./mvnw ]; then
          MVN=./mvnw
        else
          MVN=mvn
        fi

        "$MVN" -B dependency:build-classpath \
          -DincludeScope=compile \
          "-Dmdep.outputFile=$API_WORK/release-classpath.txt"

        # Generate Javadoc for the released source.
        rm -rf target/reports/apidocs

        "$MVN" -B \
          javadoc:javadoc \
          -DoutputDirectory=target/reports/apidocs \
          -Ddoclint=none \
          -DfailOnError=false

        # Put the release Javadoc under /javadoc/latest/.
        mkdir -p target/pages/javadoc/latest
        cp -R target/reports/apidocs/. target/pages/javadoc/latest/

    - name: Generate API difference report
      run: |
        API_WORK="$RUNNER_TEMP/tfw-apidiff"

        # Return to the master checkout.
        git checkout --detach origin/master

        echo "Comparing release ${RELEASE_TAG} with master."

        # Generate the comparison report.
        if "$APIDIFF" \
          --api release \
            --label "Latest Release (${RELEASE_TAG})" \
            --source-path "$API_WORK/release/source" \
            --class-path "$(cat "$API_WORK/release-classpath.txt")" \
            --api-directory "$GITHUB_WORKSPACE/target/pages/javadoc/latest" \
            --source 8 \
          --api master \
            --label "Development (master)" \
            --source-path "$API_WORK/master/source" \
            --class-path "$(cat "$API_WORK/master-classpath.txt")" \
            --api-directory "$GITHUB_WORKSPACE/target/pages/javadoc" \
            --source 8 \
          --include 'tfw.**' \
          --exclude 'tfw.math.**' \
          --compare-doc-comments true \
          --compare-api-descriptions true \
          --title "TFW API Differences" \
          --description "Changes from the latest release to master." \
          --output-directory target/pages/apidiff; then

          echo "APIDiff report generated successfully."

          # Remove temporary source trees and classpath files.
          rm -rf "$API_WORK"
          rm -rf "$RUNNER_TEMP/apidiff-source"

        else
          echo "::error::APIDiff failed. Temporary source files have been retained for troubleshooting."
          exit 1
        fi

    - name: Prepare GitHub Pages
      run: |
        # Return to the master checkout for consistency.
        git checkout --detach origin/master

        mkdir -p target/pages/pit

        cp -R target/pit-reports/. target/pages/pit/

        # Calculate the sizes of the reports.
        development_javadoc_bytes=$(find target/pages/javadoc -type f ! -path '*/latest/*' -printf '%s\n' | awk '{sum += $1} END {print sum}')
        release_javadoc_bytes=$(find target/pages/javadoc/latest -type f -printf '%s\n' | awk '{sum += $1} END {print sum}')
        apidiff_bytes=$(find target/pages/apidiff -type f -printf '%s\n' | awk '{sum += $1} END {print sum}')
        pit_bytes=$(find target/pages/pit -type f -printf '%s\n' | awk '{sum += $1} END {print sum}')

        report_bytes=$((development_javadoc_bytes + release_javadoc_bytes + apidiff_bytes + pit_bytes))

        development_javadoc_size=$(numfmt --to=iec --suffix=B "$development_javadoc_bytes")
        release_javadoc_size=$(numfmt --to=iec --suffix=B "$release_javadoc_bytes")
        apidiff_size=$(numfmt --to=iec --suffix=B "$apidiff_bytes")
        pit_size=$(numfmt --to=iec --suffix=B "$pit_bytes")
        report_size=$(numfmt --to=iec --suffix=B "$report_bytes")

        # Create the top-level GitHub Pages landing page.
        cat > target/pages/index.html <<EOF
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>TFW Reports</title>
        </head>
        <body>
          <h1>TFW Reports</h1>

          <h2>Documentation</h2>

          <ul>
            <li>
              <a href="javadoc/">Development Javadoc</a>
              — documentation for the current master branch.
            </li>
            <li>
              <a href="javadoc/latest/">Latest Release Javadoc</a>
              — documentation for release ${RELEASE_TAG}.
            </li>
            <li>
              <a href="apidiff/">API Differences</a>
              — comparison of the latest release API with master.
            </li>
          </ul>

          <h2>Testing</h2>

          <ul>
            <li>
              <a href="pit/">Mutation Testing Report</a>
              — PIT mutation testing results for the current master branch.
            </li>
          </ul>

          <h2>Site Information</h2>

          <table>
            <tr>
              <th>Content</th>
              <th>Size</th>
            </tr>
            <tr>
              <td>Development Javadoc</td>
              <td>${development_javadoc_size}</td>
            </tr>
            <tr>
              <td>Latest Release Javadoc (${RELEASE_TAG})</td>
              <td>${release_javadoc_size}</td>
            </tr>
            <tr>
              <td>API Differences</td>
              <td>${apidiff_size}</td>
            </tr>
            <tr>
              <td>PIT report</td>
              <td>${pit_size}</td>
            </tr>
            <tr>
              <td>Total reports</td>
              <td>${report_size}</td>
            </tr>
          </table>

          <p>
            Report sizes are calculated from the files published to GitHub Pages.
          </p>
        </body>
        </html>
        EOF

        # Calculate the exact size of the complete published site,
        # including the top-level index.html.
        total_bytes=$(find target/pages -type f -printf '%s\n' | awk '{sum += $1} END {print sum}')
        file_count=$(find target/pages -type f | wc -l)
        total_size=$(numfmt --to=iec --suffix=B "$total_bytes")

        # Publish machine-readable site-size information for badges and other tooling.
        cat > target/pages/site-size.json <<EOF
        {
          "bytes": ${total_bytes},
          "size": "${total_size}",
          "files": ${file_count}
        }
        EOF

        echo
        echo "GitHub Pages content:"
        echo "  Latest release:         ${RELEASE_TAG}"
        echo "  Total site size:        ${total_size} (${total_bytes} bytes)"
        echo "  Development Javadoc:    ${development_javadoc_size} (${development_javadoc_bytes} bytes)"
        echo "  Release Javadoc:        ${release_javadoc_size} (${release_javadoc_bytes} bytes)"
        echo "  API Differences:        ${apidiff_size} (${apidiff_bytes} bytes)"
        echo "  PIT size:               ${pit_size} (${pit_bytes} bytes)"
        echo "  Total reports:          ${report_size} (${report_bytes} bytes)"
        echo "  File count:             ${file_count}"

    - name: Configure GitHub Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: target/pages

  deploy:
    name: Deploy GitHub Pages
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
