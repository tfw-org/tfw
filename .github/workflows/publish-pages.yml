name: Publish GitHub Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Generate and publish reports
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Checkout project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Java 21-temurin
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install tightvncserver
      run: sudo apt-get install -y tightvncserver

    - name: Run full mutation testing
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >
        ${{ github.workspace }}/execute-on-vnc.sh
        mvn -B
        clean
        test-compile
        -Ppitest
        -DtimestampedReports=false
        org.pitest:pitest-maven:mutationCoverage

    - name: Generate Javadoc
      run: >
        mvn -B
        javadoc:javadoc
        -Ddoclint=none
        -DfailOnError=false

    - name: Prepare GitHub Pages
      run: |
        mkdir -p target/pages/pit
        mkdir -p target/pages/javadoc

        cp -R target/pit-reports/. target/pages/pit/
        cp -R target/site/apidocs/. target/pages/javadoc/

        cat > target/pages/index.html <<'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>TFW Reports</title>
        </head>
        <body>
          <h1>TFW Reports</h1>
          <ul>
            <li><a href="javadoc/">Javadoc</a></li>
            <li><a href="pit/">Mutation Testing Report</a></li>
          </ul>
        </body>
        </html>
        EOF

    - name: Configure GitHub Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: target/pages

  deploy:
    name: Deploy GitHub Pages
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
