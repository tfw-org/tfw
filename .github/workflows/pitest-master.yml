name: PIT Mutation Testing

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  pitest:
    name: Run full mutation testing
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Java 21-temurin
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install tightvncserver
      run: sudo apt-get install -y tightvncserver

    - name: Run full mutation testing
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >
        ${{ github.workspace }}/execute-on-vnc.sh
        mvn -B
        clean
        test-compile
        -Ppitest
        -DtimestampedReports=false
        org.pitest:pitest-maven:mutationCoverage

    - name: Configure GitHub Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload PIT report
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: target/pit-reports

  deploy:
    name: Deploy PIT report
    needs: pitest
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy PIT report
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0